{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}myTasks{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'taskManager/layout.css' %}">
</head>
<body>
    {% csrf_token %}
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <div class="col-auto col-md-3 col-xl-2 bg-dark" id="sidebar">
                <div class="sidebar-content">
                    <h3 class="d-none d-md-block text-white element logo">myTasks</h3>
                    <div class="element bor">
                        <i class="fa-solid fa-user"></i>
                        <span class="user text-white d-none d-md-block">{{ user.username }}</span>
                    </div>
                    <p class="text-white d-block element menu bor">Menu</p>
                    <div class="element" id="workspace">
                        <p class="text-white d-none d-md-block">WORKSPACES</p>
                    </div>
                    <a class="element bor toggle-active" href="{% url 'workspace' %}" id="create">
                        <i class="fa-solid fa-plus"></i>
                        <p class="text-white d-none d-md-block">Create workspace</p>
                    </a>
                    <div id="workspace_container"></div>
                    <p class="sidebar-empty d-none d-md-block" id="workspace-empty" hidden>No workspaces yet.</p>

                    <a href="{% url 'notification' %}" class="element bor toggle-active" id="notification">
                        <i class="fa-solid fa-bell"></i>
                        <p class="text-white d-none d-md-block">Notifications</p>
                    </a>
                    <a class="element bor" id="signout" href="{% url 'signout' %}">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <p class="text-white d-none d-md-block">Sign out</p>
                    </a>
                </div>
            </div>

            <div class="col" id="content">
                {% block body %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="{% static 'taskManager/csrf.js' %}"></script>
    <script src="{% static 'taskManager/layout.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
